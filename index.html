const by={};MA.forEach(m=>(by[m["ID Peserta"]]=by[m["ID Peserta"]]||[]).push(m));const ord=m=>pers.indexOf(m.Periode);
const stag=[],gro=[];for(const id in by){const a=by[id].sort((x,y)=>ord(x)-ord(y));if(a.length<2)continue;const b=a[0],l=a[a.length-1],p=pS.get(id);const net=m=>N(m["Omzet (Rp)"])-N(m["Biaya Operasional (Rp)"]);if(net(l)<=net(a[a.length-2]))stag.push(p);if(N(b["Omzet (Rp)"]))gro.push({p,b:N(b["Omzet (Rp)"]),l:N(l["Omzet (Rp)"]),g:(N(l["Omzet (Rp)"])-N(b["Omzet (Rp)"]))/N(b["Omzet (Rp)"])*100})}
gro.sort((a,b)=>b.g-a.g);const rec=[...MA].sort((a,b)=>(+new Date(b["Tanggal Kirim"]||0))-(+new Date(a["Tanggal Kirim"]||0))).slice(0,10);
return`<div class="top"><div><div class="eye">Portal Monitoring Dinas</div><h1>Dashboard Monev</h1><div class="mu">MegPreneur Lamongan · Tampilan analitik berdasarkan data spreadsheet</div></div><span class="pill">Akses baca saja</span></div>
<div class="card"><div class="eye" style="color:#0a8f5a">Pemantauan usaha peserta</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><select id="fy"><option value="">Semua cohort</option>${years.map(y=>`<option value="${y}" ${y==f.y?"selected":""}>MegPreneur Lamongan ${y}</option>`).join("")}</select><input id="fq" placeholder="Ketik nama usaha..." value="${esc(f.q)}"><select id="fid" style="min-width:200px"><option value="">Semua usaha</option>${P.map(p=>`<option value="${p.ID}" ${p.ID==f.id?"selected":""}>${esc(p["Nama Usaha"])}</option>`).join("")}</select><select id="fp"><option value="">Semua periode</option>${pers.map(x=>`<option ${x==f.per?"selected":""}>${esc(x)}</option>`).join("")}</select><button class="btn" id="ap">Terapkan</button><button class="btn g" id="rf">Reset</button></div></div>
<div class="g4 mt"><div class="card kpi" style="--c:#3b82f6"><small>PESERTA TERPANTAU</small><b>${n}</b><span class="mu">${Math.round(n/tot*100)}% dari ${P.length} peserta</span></div><div class="card kpi" style="--c:#10b981"><small>RATA-RATA OMZET</small><b>${rp(n?sum("Omzet (Rp)")/n:0)}</b><span class="mu">Laporan terakhir per peserta</span></div><div class="card kpi" style="--c:#f59e0b"><small>RATA-RATA BIAYA OPERASIONAL</small><b>${rp(n?sum("Biaya Operasional (Rp)")/n:0)}</b><span class="mu">Laporan terakhir per peserta</span></div><div class="card kpi" style="--c:#8b5cf6"><small>TOTAL TENAGA KERJA</small><b>${sum("Tenaga Kerja")} orang</b><span class="mu">Terserap oleh usaha yang dipantau</span></div></div>
<div class="g2 mt"><div class="card"><h2>Status Operasional Usaha</h2><div class="row mt"><div class="donut" style="background:${donut([[aktif,"#10b981"],[tidak,"#ef4444"]],tot)}"><span><div>${P.length}<br><small>Usaha</small></div></span></div><div class="leg" style="flex:1"><div><i style="background:#10b981"></i>Aktif dan Berjalan<b>${aktif} (${Math.round(aktif/tot*100)}%)</b></div><div><i style="background:#ef4444"></i>Tidak Berjalan<b>${tidak} (${Math.round(tidak/tot*100)}%)</b></div><div><i style="background:#cdd5e3"></i>Belum Melapor<b>${belum} (${Math.round(belum/tot*100)}%)</b></div></div></div></div>
<div class="card"><h2>Distribusi Kategori Bisnis</h2><div class="row mt"><div class="donut" style="background:${donut(ce.map(([k,v],i)=>[v,cc[i%6]]),tot)}"><span><div>${P.length}<br><small>Usaha</small></div></span></div><div class="leg" style="flex:1">${ce.map(([k,v],i)=>`<div><i style="background:${cc[i%6]}"></i>${esc(k)}<b>${v} (${Math.round(v/tot*100)}%)</b></div>`).join("")}</div></div></div></div>
<div class="g2 mt">${trend("Tren Omzet","Omzet (Rp)","#3b82f6")}${trend("Tren Biaya Operasional","Biaya Operasional (Rp)","#f59e0b")}${trend("Tren Transaksi","Transaksi","#14b8a6")}${trend("Tren Tenaga Kerja","Tenaga Kerja","#8b5cf6")}</div>
<div class="g3 mt"><div class="card"><h2>Tantangan Utama Peserta</h2>${pct("Tantangan Utama (pisah ;)")}</div><div class="card"><h2>Kebutuhan Tindak Lanjut Utama</h2>${pct("Kebutuhan Tindak Lanjut (pisah ;)")}</div><div class="card"><h2>Peserta Stagnan / Menurun</h2><div class="mu">Berdasarkan omzet dikurangi biaya operasional</div>${stag.length?stag.map(p=>`<p><a href="#detail-${p.ID}" style="color:var(--ac)">${esc(p["Nama Usaha"])}</a></p>`).join(""):`<p class="mu">Belum ada peserta dengan tren stagnan / menurun.</p>`}</div></div>
<div class="card mt tw"><h2>Ranking Pertumbuhan Omzet — Top 5</h2><table><tr><th>#<th>Peserta<th>Usaha<th>Baseline<th>Terbaru<th>Pertumbuhan</tr>${gro.slice(0,5).map((g,i)=>`<tr><td>${i+1}<td>${esc(g.p["Nama Peserta"])}<td>${esc(g.p["Nama Usaha"])}<td>${rp(g.b)}<td>${rp(g.l)}<td class="${g.g>=0?"up":"dn"}">${g.g.toFixed(1)}%</tr>`).join("")||`<tr><td colspan=6 class="mu">Belum ada data pertumbuhan omzet.</tr>`}</table></div>
<div class="card mt tw"><h2>Laporan Terakhir Peserta</h2><table><tr><th>Usaha<th>Peserta<th>Cohort<th>Periode<th>Omzet<th>Tenaga kerja<th>Terkirim</tr>${rec.map(m=>{const p=pS.get(m["ID Peserta"]);return`<tr><td><b>${esc(p["Nama Usaha"])}</b><td>${esc(p["Nama Peserta"])}<td>${cohort(p)}<td>${esc(m.Periode)}<td>${rp(N(m["Omzet (Rp)"]))}<td>${N(m["Tenaga Kerja"])}<td>${dt(m["Tanggal Kirim"])}</tr>`}).join("")||`<tr><td colspan=7 class="mu">Belum ada laporan.</tr>`}</table></div>`}
function bind(){const g=s=>document.querySelector(s);if(g("#sq")){const go=()=>{ST.q=g("#q").value;ST.pg=1;route()};g("#sq").onclick=go;g("#q").onkeydown=e=>e.key=="Enter"&&go();g("#pp").onchange=e=>{ST.per=+e.target.value;ST.pg=1;route()};document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{ST.pg=+b.dataset.pg;route()})}
if(g("#ap")){g("#ap").onclick=()=>{ST.f={y:g("#fy").value,q:g("#fq").value,id:g("#fid").value,per:g("#fp").value};route()};g("#rf").onclick=()=>{ST.f={y:"",q:"",id:"",per:""};route()}}}
route();remote();
</script></body></html>
